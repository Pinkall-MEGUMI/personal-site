<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 · 页面不存在</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fff;
        color: #1a1a1a;
        font: 16px/1.75 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        padding: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #e8eaed; }
        .card { border-color: #262b34 !important; }
        code { background: #171a21 !important; }
      }
      .card {
        max-width: 26rem;
        width: 100%;
        border: 1px solid #e6e8ec;
        border-radius: 12px;
        padding: 2rem;
        text-align: center;
      }
      .code { font-size: 3rem; font-weight: 700; letter-spacing: .05em; margin: 0; opacity: .9; }
      p { color: #5c6470; margin: .75rem 0 1.5rem; }
      a.btn {
        display: inline-block;
        padding: .6rem 1.2rem;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-size: .925rem;
      }
      a.plain { display: block; margin-top: 1rem; font-size: .875rem; color: #5c6470; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">404</p>
      <p>这个地址下没有内容，可能是链接打错了，或者文章被移动过。</p>
      <a class="btn" href="/">回到首页</a>
      <a class="plain" href="/search/">搜索站内内容</a>
    </div>
  </body>
</html>
